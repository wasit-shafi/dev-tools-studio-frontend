<nav class="flex justify-center">
	<ul class="menu menu-vertical rounded-box bg-base-200 xs:menu-horizontal gap-x-3 gap-y-2">
		@if (currentUser$ | async; as currentUser) {
			<!-- Profile Picture -->

			<form #addProfilePictureForm="ngForm">
				<div class="avatar">
					<div class="mask mask-hexagon-2 w-9">
						<img
							class="bg-slate-300"
							[src]="
								currentUser.profilePicture ? currentUser.profilePicture : 'assets/images/profile-picture-fallback.svg'
							"
							alt="profile_img"
							priority
						/>
						<img
							class="absolute top-0 left-0 cursor-pointer rounded-full bg-pink-500 opacity-0 transition-opacity duration-150 ease-in hover:opacity-75"
							src="assets/images/circle-with-plus-24.svg"
							alt="add_new"
							(click)="profile_picture.click()"
							priority
						/>
						<input
							type="file"
							class="hidden"
							#profile_picture
							(change)="handleUploadProfilePicture($event)"
						/>
					</div>
				</div>
			</form>

			<!-- Dashboard -->

			<li [routerLink]="[constants.ROUTES._DASHBOARD]">
				<a [routerLinkActive]="['menu-active']">
					<svg
						class="h-5 w-5"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
						></path>
					</svg>
					Dashboard
				</a>
			</li>
			<!-- Settings -->

			<li [routerLink]="[constants.ROUTES._SETTINGS]">
				<a [routerLinkActive]="['menu-active']">
					<svg
						class="h-5 w-5"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
						></path>
					</svg>
					Settings
				</a>
			</li>
			<!-- Control Panel (only for admin users) -->

			<li
				[routerLink]="[constants.ROUTES._CONTROL_PANEL]"
				*dtsHasPermission="{
					roles: [constants.ACCESS_ROLES.ADMIN, constants.ACCESS_ROLES.SUPER_ADMIN],
					operation: constants.ACCESS_OPERATIONS.OR,
				}"
			>
				<a [routerLinkActive]="['menu-active']">
					<svg
						class="h-5 w-5"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
						></path>
					</svg>
					Control Panel
				</a>
			</li>
			<!-- Sign Out -->

			<li (click)="handleSignOut()">
				<a>
					<svg
						class="h-5 w-5"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
						></path>
					</svg>
					Sign Out
				</a>
			</li>
		} @else {
			<!-- Home -->

			<li [routerLink]="[constants.ROUTES.ROOT]">
				<a
					[routerLinkActive]="['menu-active']"
					[routerLinkActiveOptions]="{ exact: true }"
				>
					<svg
						class="h-5 w-5"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
						></path>
					</svg>
					Home
				</a>
			</li>
			<!-- Contact -->

			<li [routerLink]="[constants.ROUTES._CONTACT]">
				<a [routerLinkActive]="['menu-active']">
					<svg
						class="h-5 w-5"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
						></path>
					</svg>
					Contact
				</a>
			</li>
			<!-- Sign Up -->

			<li [routerLink]="[constants.ROUTES._SIGNUP]">
				<a [routerLinkActive]="['menu-active']">
					<svg
						class="h-5 w-5"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
						></path>
					</svg>
					Sign Up
				</a>
			</li>
			<!-- Sign In -->

			<li [routerLink]="[constants.ROUTES._SIGNIN]">
				<a [routerLinkActive]="['menu-active']">
					<svg
						class="h-5 w-5"
						xmlns="http://www.w3.org/2000/svg"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
						></path>
					</svg>
					Sign In
				</a>
			</li>
		}
	</ul>
</nav>
