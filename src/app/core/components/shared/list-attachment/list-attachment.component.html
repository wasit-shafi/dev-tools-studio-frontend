<div class="min-h-50 overflow-x-auto rounded-lg bg-slate-100">
	@let attachmentList = attachmentList$ | async;

	@if (attachmentList?.length) {
		<table class="table-zebra table">
			<thead>
				<tr>
					<th></th>
					<th>Attachment Name</th>
					<th>File Name</th>
				</tr>
			</thead>
			<tbody>
				@for (attachment of attachmentList; track $index) {
					<tr>
						<td>
							<div class="flex items-center gap-x-2">
								<span>{{ $index + 1 }}.</span>
								<button
									class="btn btn-sm w-9 p-0"
									(click)="handleDeleteAttachment(attachment._id)"
									title="Delete attachment"
								>
									<img
										class="inline-block size-5"
										src="assets/images/delete-24.svg"
										alt="delete"
									/>
								</button>
							</div>
						</td>
						<td>{{ attachment.attachmentName }}</td>
						<td>{{ attachment.fileName }}</td>
					</tr>
				}
			</tbody>
		</table>
	} @else {
		<div
			role="alert"
			class="alert alert-info my-10"
		>
			<svg
				xmlns="http://www.w3.org/2000/svg"
				fill="none"
				viewBox="0 0 24 24"
				class="h-6 w-6 shrink-0 stroke-current"
			>
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
					d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
				></path>
			</svg>
			<span>No Attachment Added Yet</span>
		</div>
	}
</div>
