@if (blocker$ | async; as blocker) {
	@if (blocker.isVisible) {
		<div class="fixed inset-x-0 inset-y-0 flex cursor-wait items-center justify-center">
			<!-- backdrop -->

			<div class="bg-softPeach/[.15] absolute h-screen w-screen backdrop-blur-[2px]"></div>
			<!-- progress meter -->

			<progress class="progress progress-primary absolute top-0 w-full rounded-none"></progress>

			<div class="relative max-w-[600px] px-9 text-center">
				<span class="flex gap-x-3">
					<span class="text-caribbeanGreen mt-1 text-4xl text-black/75 drop-shadow-lg">
						{{ blocker.primaryText }}
					</span>
					<img
						class="drop-shadow-lg"
						ngSrc="assets/images/bean-eater.svg"
						alt="bean-eater-icon"
						width="60"
						height="60"
						fetchpriority="high"
					/>
				</span>

				@if (blocker.secondaryText) {
					<p class="text-orangePeel mt-3 text-xl text-black/75 drop-shadow-lg">
						{{ blocker.secondaryText }}
					</p>
				}
			</div>
		</div>
	}
}
