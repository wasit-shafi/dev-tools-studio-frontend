<div class="flex">
	<button
		class="btn btn-success ml-auto"
		(click)="handleOnModalOpen()"
	>
		<img
			src="assets/images/circular-plus-24.svg "
			alt="add-icon"
		/>
		Add New Credential
	</button>
</div>

<dialog
	#credentialDialog
	class="modal"
>
	<div class="modal-box">
		<h3 class="text-lg font-bold">Add New Credential</h3>
		<div class="modal-action">
			<form
				#credentialForm="ngForm"
				(ngSubmit)="handleOnSubmitCredentialForm($event, credentialForm)"
				class="mx-auto flex flex-1 flex-col justify-center gap-4"
			>
				<!-- Credential Type  -->

				<select
					name="credentialType"
					class="select w-full"
					required
					[(ngModel)]="credentialFormModel.credentialType"
				>
					<option
						disabled
						selected
						value=""
					>
						Select Credential Type
					</option>
					<option [value]="constants.CREDENTIAL_TYPE.SMTP.VALUE">SMTP</option>
					<option
						[value]="constants.CREDENTIAL_TYPE.OAUTH.VALUE"
						disabled
					>
						OAuth
					</option>
				</select>
				<!-- Email  -->

				<label
					class="input input-bordered flex w-full items-center gap-2"
					for="email"
				>
					Email
					<input
						class="grow"
						id="emailId"
						name="emailId"
						type="email"
						title="Enter your email/username"
						[(ngModel)]="credentialFormModel.emailId"
						[pattern]="constants.REGEX.EMAIL"
						autofocus
						#email="ngModel"
						required
					/>
				</label>
				<!-- Host -->

				<label
					class="input input-bordered flex w-full items-center gap-2"
					for="host"
				>
					Host
					<input
						class="grow"
						id="host"
						name="host"
						type="text"
						title="Enter host address"
						[(ngModel)]="credentialFormModel.host"
						autofocus
						#host="ngModel"
						required
					/>
				</label>
				<!-- Port -->

				<label
					class="input input-bordered flex w-full items-center gap-2"
					for="port"
				>
					Port
					<input
						class="grow"
						id="port"
						name="port"
						type="text"
						title="Enter Port No"
						[(ngModel)]="credentialFormModel.port"
						autofocus
						#port="ngModel"
						required
						list="regular-smtp-ports"
					/>
					<datalist id="regular-smtp-ports">
						@for (smtpPort of constants.REGULAR_SMTP_PORTS; track $index) {
							<option [value]="smtpPort">Port {{ smtpPort }}</option>
						}
					</datalist>
				</label>
				<!-- User -->

				<label
					class="input input-bordered flex w-full items-center gap-2"
					for="user"
				>
					User
					<input
						class="grow"
						id="user"
						name="user"
						type="text"
						title="Enter user"
						[(ngModel)]="credentialFormModel.user"
						autofocus
						#user="ngModel"
						required
					/>
				</label>
				<!-- Pass -->

				<label
					class="input input-bordered flex w-full items-center gap-2"
					for="pass"
				>
					Pass
					<input
						class="grow"
						id="pass"
						name="pass"
						type="text"
						title="Enter pass"
						[(ngModel)]="credentialFormModel.pass"
						autofocus
						#pass="ngModel"
						required
					/>
				</label>

				<div class="modal-action">
					<button
						class="btn btn-success flex-1 text-white"
						type="submit"
						[disabled]="!credentialForm.form.valid"
					>
						Submit
					</button>
					<button
						class="btn flex-1"
						type="button"
						(click)="handleOnModalClose()"
					>
						Cancel
					</button>
				</div>
			</form>
		</div>
	</div>
</dialog>
