<div class="tabs tabs-border bg-cyan-100">
	<!-- Email Tab -->

	<input
		type="radio"
		name="dashboard-tabs"
		class="tab"
		aria-label="Email"
		checked
	/>
	<div class="tab-content px-5 py-10">
		<dts-email></dts-email>
	</div>
	<!-- Admin Tab -->

	<ng-container
		*dtsHasPermission="{
			roles: [constants.ACCESS_ROLES.ADMIN, constants.ACCESS_ROLES.SUPER_ADMIN],
			operation: constants.ACCESS_OPERATIONS.OR,
		}"
	>
		<input
			type="radio"
			name="dashboard-tabs"
			class="tab"
			aria-label="Admin"
		/>
		<div class="tab-content px-5 py-10">
			<dts-admin></dts-admin>
		</div>
	</ng-container>
	<!-- Colors Tab -->

	<input
		type="radio"
		name="dashboard-tabs"
		class="tab"
		aria-label="Colors"
	/>
	<div class="tab-content px-5 py-10">
		<dts-colors></dts-colors>
	</div>
	<!-- Meta Tags Tab -->

	<input
		type="radio"
		name="dashboard-tabs"
		class="tab"
		aria-label="Meta tags"
	/>
	<div class="tab-content px-5 py-10">
		<dts-meta-tags></dts-meta-tags>
	</div>
	<!-- Open Graph Tab -->

	<input
		type="radio"
		name="dashboard-tabs"
		class="tab"
		aria-label="Open Graph"
	/>
	<div class="tab-content px-5 py-10">
		<dts-open-graph></dts-open-graph>
	</div>
</div>
